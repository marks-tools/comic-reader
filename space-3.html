<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>コミックリーダー 仮試作</title>
    <style>
      :root {
        --bar-bg: rgba(18, 18, 20, 0.94);
        --bar-border: rgba(255, 255, 255, 0.14);
        --btn-bg: #2a2a2e;
        --btn-bg-hover: #38383d;
        --btn-border: rgba(255, 255, 255, 0.16);
        --btn-text: #f4f4f2;
        --btn-dim: #a1a1aa;
        --accent: #e0a83c;
        --accent-text: #1c1503;
        --panel-bg: #17171a;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      #appRoot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        height: var(--app-h, 100dvh);
        overflow: hidden;
        background: #000;
        transform-origin: center center;
      }
      /* Rotated landscape for environments whose viewport never rotates
         (e.g. the Muse app on iPhone): rotate the whole stage -90deg
         (counter-clockwise) so the reader holds the phone turned to
         their right and reads in landscape. Width/height are swapped. */
      body.rotated #appRoot {
        width: var(--app-h, 100dvh);
        height: var(--app-w, 100vw);
        inset: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-90deg);
      }
      html, body {
        height: 100%;
        height: var(--app-h, 100dvh);
        margin: 0;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      html {
        position: fixed;
        inset: 0;
        width: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--btn-text);
        position: fixed;
        inset: 0;
        width: 100%;
        height: var(--app-h, 100dvh);
        overscroll-behavior: none;
        touch-action: none;
      }

      /* ---------- stage ---------- */
      #viewport {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        overflow: hidden;
        transition: top 0.22s ease, bottom 0.22s ease;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        perspective: 1800px;
        background: #000;
      }
      #stageWrap {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      #stageWrap.anim { transition: transform 0.25s ease; }
      #sheet {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        will-change: transform, opacity;
      }
      .frame {
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        background: #000;
      }
      .frame img {
        display: block;
        /* The img box always fills its frame exactly and the picture is
           scaled down inside it with contain. With width/height:auto the
           image kept its intrinsic size, which on narrow screens (iPhone
           Safari flex behaviour) let one page take the whole width and
           pushed the other page off-screen, so spread never appeared. */
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: 50% 50%;
        pointer-events: none;
      }
      .frame.blank { background: #050505; }
      /* A src-less img in a blank frame can render as a bordered
         broken-image box in some browsers; hide it outright. */
      .frame.blank img { display: none; }
      /* single */
      #sheet.single .frame-single { display: flex; flex: 1 1 auto; }
      /* wide scan: one landscape image already contains a full spread.
         It is shown as a single full-sheet page in both modes — never
         paired, never squeezed into a half-width frame. */
      #sheet.wide { flex-direction: row; gap: 0; width: 100%; height: 100%; }
      #sheet.wide .frame-single { display: flex; flex: 1 1 auto; }
      #sheet.wide .frame-single img,
      #sheet.single.wide .frame-single img { object-position: 50% 50%; }
      /* spread: DOM order is [left][spine][right] visually via row direction;
         we place right frame last in DOM and use row so left shows left.
         Reading order is right -> left. */
      #sheet.spread .frame-right,
      #sheet.spread .frame-left {
        display: flex;
        /* Each page gets exactly half of the sheet width, whatever the
           screen width is — never sized by the image inside it. This is
           what makes spread work on narrow iPhone screens too, in both
           portrait and landscape. */
        flex: 0 0 50%;
        width: 50%;
        max-width: 50%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      /* Spread: pages meet exactly at the centre line — no gap, no spine.
         The picture inside each full-frame img box is anchored toward
           the centre, so the two page edges touch at the centre line and
           the pair stays centred as a whole. */
      #sheet.spread .frame-left { justify-content: flex-end; }
      #sheet.spread .frame-right { justify-content: flex-start; border-left: 0; }
      #sheet.spread .frame-left img { object-position: 100% 50%; }
      #sheet.spread .frame-right img { object-position: 0% 50%; }
      #sheet.spread { flex-direction: row; gap: 0; width: 100%; height: 100%; }
      .spine {
        display: none;
        width: 0;
      }
      #sheet.spread .spine { display: none; }

      /* ---------- read-done chip ---------- */
      #doneChip {
        position: absolute;
        top: calc(10px + var(--safe-t));
        right: calc(12px + var(--safe-r));
        z-index: 30;
        display: none;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
      #doneChip.show { display: block; }
      body.ui-on #doneChip { display: none; }

      /* ---------- toolbars ---------- */
      .bar {
        position: absolute;
        left: 0; right: 0;
        z-index: 40;
        background: var(--bar-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease, transform 0.22s ease;
      }
      #topBar {
        top: 0;
        padding: calc(8px + var(--safe-t)) calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));
        border-bottom: 1px solid var(--bar-border);
        transform: translateY(-8px);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #bottomBar {
        bottom: 0;
        padding: 10px calc(14px + var(--safe-r)) calc(10px + var(--safe-b)) calc(14px + var(--safe-l));
        border-top: 1px solid var(--bar-border);
        transform: translateY(8px);
      }
      body.ui-on .bar { opacity: 1; pointer-events: auto; transform: translateY(0); }

      #pageInfo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #doneBadge {
        display: none;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #doneBadge.show { display: inline-block; }
      #zoomState {
        font-size: 13px;
        color: var(--btn-dim);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #bookTitle {
        font-size: 13px;
        font-weight: 600;
        color: var(--btn-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topSpacer { flex: 1 1 auto; }

      .btn {
        appearance: none;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--btn-text);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        padding: 12px 16px;
        border-radius: 10px;
        cursor: pointer;
        min-height: 44px;
        white-space: nowrap;
      }
      .btn:active { background: var(--btn-bg-hover); }
      .btn:disabled { opacity: 0.35; cursor: default; }
      .btn:disabled:active { background: var(--btn-bg); }
      .btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn.icon { padding: 12px 14px; display: inline-flex; align-items: center; gap: 7px; }
      .btn svg { width: 19px; height: 19px; flex: none; }

      #sliderRow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      #sliderRow .edge {
        font-size: 12px;
        color: var(--btn-dim);
        font-variant-numeric: tabular-nums;
      }
      #pageSlider {
        flex: 1 1 auto;
        accent-color: var(--accent);
        height: 28px;
        margin: 0;
        direction: rtl;
      }
      #btnRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      #btnRow .group { display: flex; gap: 8px; align-items: center; }
      #btnRow .sep { width: 1px; align-self: stretch; background: var(--bar-border); margin: 2px 2px; }
      #btnRow .grow { flex: 1 1 auto; }

      /* ---------- settings ---------- */
      body.ui-on #viewport { top: var(--tb, 57px); bottom: var(--bb, 120px); }
      #scrim {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }
      #scrim.show { opacity: 1; pointer-events: auto; }
      #settings {
        position: absolute;
        top: 0; bottom: 0;
        right: 0;
        z-index: 60;
        width: min(360px, 92vw);
        background: var(--panel-bg);
        border-left: 1px solid var(--bar-border);
        padding: calc(16px + var(--safe-t)) calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) 20px;
        transform: translateX(105%);
        transition: transform 0.26s ease;
        overflow-y: auto;
      }
      #settings.show { transform: translateX(0); }
      #settings h2 {
        font-size: 19px;
        margin: 2px 0 18px;
        font-weight: 700;
      }
      .setGroup { margin-bottom: 24px; }
      .setLabel {
        font-size: 13px;
        font-weight: 700;
        color: var(--btn-dim);
        letter-spacing: 0.06em;
        margin-bottom: 9px;
      }
      .seg {
        display: flex;
        background: #26262b;
        border: 1px solid var(--btn-border);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        flex: 1 1 0;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--btn-dim);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 4px;
        border-radius: 8px;
        cursor: pointer;
        min-height: 42px;
        line-height: 1.25;
      }
      .seg button.sel { background: var(--accent); color: var(--accent-text); }
      .wideBtn {
        width: 100%;
        appearance: none;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--btn-text);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        padding: 13px;
        border-radius: 10px;
        cursor: pointer;
        min-height: 48px;
      }
      .wideBtn:active { background: var(--btn-bg-hover); }
      #settings .foot { margin-top: 30px; }

      @media (max-width: 560px) {
        .btn { font-size: 14px; padding: 11px 12px; }
        #pageInfo { font-size: 15px; }
        #zoomState { display: none; }
        #bookTitle { display: none; }
      }

      /* ---------- landscape: follow device orientation (no toggle button) ---------- */
      /* The stage already fits by height via object-fit:contain; in landscape
         we keep the whole page inside one screen — no scroll, no bounce —
         and shrink the chrome so a short iPhone landscape height still
         leaves room for the page itself. */
      @media (orientation: landscape) {
        /* Do NOT set an explicit height on #viewport: it is sized by
           top/bottom (full height when UI is hidden, between the bars
           when UI is shown). An explicit height over-constrains it and
           crops the page bottom behind the bottom bar. */
        #sheet, #stageWrap { height: 100%; max-height: 100%; }
        #settings {
          width: min(340px, 86vw);
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }
      }
      @media (orientation: landscape) and (max-height: 540px) {
        /* iPhone landscape: compact bars so page + bars fit one screen */
        #topBar {
          padding-top: calc(5px + var(--safe-t));
          padding-bottom: 5px;
          padding-left: calc(12px + var(--safe-l));
          padding-right: calc(12px + var(--safe-r));
          gap: 8px;
        }
        #bottomBar {
          padding-top: 6px;
          padding-bottom: calc(6px + var(--safe-b));
          padding-left: calc(12px + var(--safe-l));
          padding-right: calc(12px + var(--safe-r));
        }
        #sliderRow { margin-bottom: 5px; gap: 8px; }
        #pageSlider { height: 20px; }
        #btnRow { gap: 6px; flex-wrap: wrap; }
        #btnRow .group { gap: 6px; }
        #btnRow .sep { margin: 1px 1px; }
        .btn {
          font-size: 13px;
          padding: 7px 10px;
          min-height: 34px;
          border-radius: 8px;
        }
        .btn.icon { padding: 7px 10px; }
        .btn svg { width: 16px; height: 16px; }
        #pageInfo { font-size: 14px; gap: 7px; }
        #zoomState { display: none; }
        #bookTitle { display: none; }
        #doneChip { top: calc(6px + var(--safe-t)); }
        /* Settings panel fits inside the short landscape height */
        #settings {
          padding-top: calc(10px + var(--safe-t));
          padding-bottom: calc(10px + var(--safe-b));
          padding-left: 16px;
        }
        #settings h2 { font-size: 17px; margin: 0 0 10px; }
        .setGroup { margin-bottom: 14px; }
        .setLabel { margin-bottom: 6px; }
        .seg button { min-height: 34px; padding: 6px 4px; font-size: 13px; }
        .wideBtn { min-height: 40px; padding: 9px; font-size: 14px; }
        #settings .foot { margin-top: 14px; }
      }
      /* Rotated mode: the effective height is the portrait width (short
         on iPhone), so use the same compact chrome as landscape phones.
         These rules apply regardless of the orientation media query,
         which still reports portrait while rotated. */
      body.rotated #topBar {
        padding-top: calc(5px + var(--safe-t));
        padding-bottom: 5px;
        gap: 8px;
      }
      body.rotated #bottomBar { padding-top: 6px; padding-bottom: calc(6px + var(--safe-b)); }
      body.rotated #sliderRow { margin-bottom: 5px; gap: 8px; }
      body.rotated #pageSlider { height: 20px; }
      body.rotated #btnRow { gap: 6px; }
      body.rotated #btnRow .group { gap: 6px; }
      body.rotated .btn { font-size: 13px; padding: 7px 10px; min-height: 34px; border-radius: 8px; }
      body.rotated .btn.icon { padding: 7px 10px; }
      body.rotated .btn svg { width: 16px; height: 16px; }
      body.rotated #pageInfo { font-size: 14px; gap: 7px; }
      body.rotated #zoomState { display: none; }
      body.rotated #bookTitle { display: none; }
      body.rotated #settings { width: min(340px, 86%); }
      body.rotated #settings h2 { font-size: 17px; margin: 0 0 10px; }
      body.rotated .setGroup { margin-bottom: 14px; }
      body.rotated .seg button { min-height: 34px; padding: 6px 4px; font-size: 13px; }
      body.rotated .wideBtn { min-height: 40px; padding: 9px; font-size: 14px; }

      @media (prefers-reduced-motion: reduce) {
        .bar, #settings, #scrim { transition: none; }
      }
    </style>
  </head>
  <body>
   <div id="appRoot">
    <div id="viewport" aria-label="コミック表示エリア">
      <div id="stageWrap">
        <div id="sheet" class="single">
          <div class="frame frame-left" id="frameLeft"><img id="imgLeft" alt="" draggable="false" /></div>
          <div class="spine" aria-hidden="true"></div>
          <div class="frame frame-right" id="frameRight"><img id="imgRight" alt="" draggable="false" /></div>
          <div class="frame frame-single" id="frameSingle"><img id="imgSingle" alt="" draggable="false" /></div>
        </div>
      </div>
    </div>

    <div id="doneChip">読了</div>

    <header class="bar" id="topBar">
      <div id="pageInfo"><span id="pageText">1 / 30</span><span id="doneBadge">読了</span></div>
      <span id="bookTitle">ワンピース 110巻</span>
      <span id="zoomState"></span>
      <div class="topSpacer"></div>
      <button class="btn icon" id="btnSettings" type="button" aria-label="設定を開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        設定
      </button>
    </header>

    <footer class="bar" id="bottomBar">
      <div id="sliderRow">
        <span class="edge">30</span>
        <input id="pageSlider" type="range" min="1" max="30" step="1" value="1" aria-label="ページ移動" />
        <span class="edge">1</span>
      </div>
      <div id="btnRow">
        <div class="group">
          <button class="btn" id="btnPrev" type="button">← 前へ</button>
          <button class="btn" id="btnNext" type="button">次へ →</button>
        </div>
        <div class="sep" aria-hidden="true"></div>
        <div class="group">
          <button class="btn" id="btnMode" type="button">見開き表示</button>
        </div>
        <div class="sep" aria-hidden="true"></div>
        <div class="group">
          <button class="btn" id="btnShift" type="button" aria-pressed="false">見開きをずらす</button>
        </div>
        <div class="sep" aria-hidden="true"></div>
        <div class="group">
          <button class="btn" id="btnZoomMode" type="button" aria-pressed="false">ズーム OFF</button>
          <button class="btn" id="btnZoomReset" type="button" disabled>等倍に戻す</button>
        </div>
      </div>
    </footer>

    <div id="scrim"></div>
    <aside id="settings" aria-label="設定">
      <h2>設定</h2>

      <div class="setGroup">
        <div class="setLabel">タップ割当</div>
        <div class="seg" id="segTap">
          <button type="button" data-val="normal">右＝進む<br />左＝戻る</button>
          <button type="button" data-val="invert">右＝戻る<br />左＝進む</button>
        </div>
      </div>

      <div class="setGroup">
        <div class="setLabel">ページ送り</div>
        <div class="seg" id="segAnim">
          <button type="button" data-val="instant">すぐめくる</button>
          <button type="button" data-val="curl">ページ送り</button>
        </div>
      </div>

      <div class="setGroup">
        <div class="setLabel">ズーム規定値（トリプルタップ）</div>
        <div class="seg" id="segZoom">
          <button type="button" data-val="125">125%</button>
          <button type="button" data-val="150">150%</button>
          <button type="button" data-val="175">175%</button>
          <button type="button" data-val="200">200%</button>
        </div>
      </div>

      <div class="setGroup">
        <div class="setLabel">表示</div>
        <div class="seg" id="segMode">
          <button type="button" data-val="single">単ページ</button>
          <button type="button" data-val="spread">見開き</button>
        </div>
      </div>

      <div class="setGroup">
        <div class="setLabel">横画面で読む</div>
        <div class="seg" id="segRotate">
          <button type="button" data-val="off">OFF</button>
          <button type="button" data-val="on">ON</button>
        </div>
        <p style="margin:8px 2px 0;font-size:12.5px;line-height:1.55;color:var(--btn-dim)">端末を倒しても横にならないとき用です。ONにしたら端末を右に倒して持ってください。すでに横向きの画面ではそのまま表示します。</p>
      </div>

      <div class="foot">
        <button class="wideBtn" id="btnRestart" type="button">最初から読む</button>
      </div>
      <div class="foot">
        <button class="wideBtn" id="btnCloseSettings" type="button">閉じる</button>
      </div>
    </aside>
   </div><!-- /appRoot -->

    <script>
      (function () {
        'use strict';
        var TOTAL = 30;
        /* v3: book changed (One Piece vol.23 -> vol.110); the previous
           book's saved page/settings must not carry over. */
        var STORE_KEY = 'comicReaderProto.v3-onepiece110';
        var srcFor = function (i) { return 'assets/page-' + String(i).padStart(3, '0') + '.jpg'; };
        /* Wide-scan rule (kept for scan-type books): in a book whose
           files from index 2 on are landscape scans containing a full
           spread, those files count as one display unit. This volume
           (110, digital edition) is all portrait, so the rule never
           triggers here and spreads pair two portrait pages. */
        var WIDE_SCAN_BOOK = false;
        function isWidePage(p) { return typeof p === 'number' && p >= 2 && WIDE_SCAN_BOOK; }

        /* ---------- state ---------- */
        var S = {
          page: 0,
          mode: null, /* 'single' | 'spread' */
          shiftOn: false,
          shiftAt: 0,
          finished: false,
          zoomOn: false,
          settings: { invert: false, anim: 'curl', zoomPreset: 150, rotate: false }
        };
        try {

          }
          if (h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
          if (w > 0) document.documentElement.style.setProperty('--app-w', w + 'px');
          updateRotateState();
        }
        var orientTimers = [];
        function handleViewportChange() {
          syncViewportHeight();
          refreshRect();
          layoutBars();
          clampPan();
          applyZoom(false);
          render();
          refreshRect();
        }
        function scheduleViewportSync() {
          handleViewportChange();
          for (var i = 0; i < orientTimers.length; i++) clearTimeout(orientTimers[i]);
          orientTimers = [
            setTimeout(handleViewportChange, 60),
            setTimeout(handleViewportChange, 260),
            setTimeout(handleViewportChange, 520)
          ];
        }
        window.addEventListener('resize', scheduleViewportSync);
        window.addEventListener('orientationchange', scheduleViewportSync);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            syncViewportHeight(); layoutBars();
          });
        }
        /* Prevent vertical bounce / pull-scroll on iOS when not zoom-panning */
        document.addEventListener('touchmove', function (e) {
          if (settingsEl.classList.contains('show') && settingsEl.contains(e.target)) return;
          if (e.target === pageSlider) return;
          if (e.target && e.target.closest && e.target.closest('#bottomBar, #topBar')) return;
          if (e.cancelable) e.preventDefault();
        }, { passive: false });

        /* ---------- init ---------- */
        syncViewportHeight();
        applyZoom(false);
        render();
        showUI();
      })();
    </script>
  </body>
</html>
